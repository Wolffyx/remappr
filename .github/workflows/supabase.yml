name: Supabase

# PRs: migrations + pgTAP + lint + type drift against a throwaway local stack
# (no secrets, so fork PRs work). Push to dev: deploy to the staging project.
# A published release: deploy the same tag to production, alongside
# remappr.com and the installers (migrations must stay additive, since the
# previous app version keeps running against them for a while).

on:
    pull_request:
        paths:
            - 'supabase/**'
            - 'src/renderer/src/lib/cloud/database.types.ts'
            - '.github/workflows/supabase.yml'
    push:
        branches: [dev]
        paths:
            - 'supabase/**'
    release:
        types: [published]

permissions:
    contents: read

concurrency:
    group: supabase-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

            - name: Set up pnpm
              uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

            - name: Set up Node
              uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
              with:
                  node-version-file: '.nvmrc'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile --ignore-scripts

            # --ignore-scripts also skipped the CLI's binary download.
            - name: Install Supabase CLI binary
              run: pnpm rebuild supabase

            - name: Start local stack
              run: pnpm exec supabase start -x vector,logflare,studio,imgproxy,realtime,supavisor,postgres-meta,edge-runtime

            - name: Reset (migrations + seed)
              run: pnpm db:reset

            - name: pgTAP
              run: pnpm db:test

            - name: Lint schema
              run: pnpm db:lint

            - name: Generated types are current
              run: |
                  pnpm db:types
                  git diff --exit-code -- src/renderer/src/lib/cloud/database.types.ts \
                    || { echo "::error::database.types.ts is stale. Run pnpm db:types and commit it."; exit 1; }

    deploy-staging:
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        environment: supabase-staging
        env:
            SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
            SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_STAGING }}
            PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF_STAGING }}
        steps:
            - name: Skip without a staging project
              id: guard
              run: |
                  if [ -z "$PROJECT_REF" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
                    echo "::notice::No staging Supabase secrets; skipping deploy."
                    echo "skip=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Checkout
              if: steps.guard.outputs.skip != 'true'
              uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

            - name: Set up pnpm
              if: steps.guard.outputs.skip != 'true'
              uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

            - name: Set up Node
              if: steps.guard.outputs.skip != 'true'
              uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
              with:
                  node-version-file: '.nvmrc'
                  cache: 'pnpm'

            - name: Install Supabase CLI
              if: steps.guard.outputs.skip != 'true'
              run: |
                  pnpm install --frozen-lockfile --ignore-scripts
                  pnpm rebuild supabase

            - name: Link staging
              if: steps.guard.outputs.skip != 'true'
              run: pnpm exec supabase link --project-ref "$PROJECT_REF"

            - name: Push migrations
              if: steps.guard.outputs.skip != 'true'
              run: pnpm exec supabase db push

            - name: Deploy Edge Functions
              if: steps.guard.outputs.skip != 'true' && hashFiles('supabase/functions/*/index.ts') != ''
              run: pnpm exec supabase functions deploy

    deploy-production:
        if: github.event_name == 'release'
        runs-on: ubuntu-latest
        environment: supabase-production
        env:
            SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
            SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PRODUCTION }}
            PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF_PRODUCTION }}
        steps:
            - name: Skip without a production project
              id: guard
              run: |
                  if [ -z "$PROJECT_REF" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
                    echo "::notice::No production Supabase secrets; skipping deploy."
                    echo "skip=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Checkout
              if: steps.guard.outputs.skip != 'true'
              uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

            - name: Set up pnpm
              if: steps.guard.outputs.skip != 'true'
              uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

            - name: Set up Node
              if: steps.guard.outputs.skip != 'true'
              uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
              with:
                  node-version-file: '.nvmrc'
                  cache: 'pnpm'

            - name: Install Supabase CLI
              if: steps.guard.outputs.skip != 'true'
              run: |
                  pnpm install --frozen-lockfile --ignore-scripts
                  pnpm rebuild supabase

            - name: Link production
              if: steps.guard.outputs.skip != 'true'
              run: pnpm exec supabase link --project-ref "$PROJECT_REF"

            - name: Push migrations
              if: steps.guard.outputs.skip != 'true'
              run: pnpm exec supabase db push

            - name: Deploy Edge Functions
              if: steps.guard.outputs.skip != 'true' && hashFiles('supabase/functions/*/index.ts') != ''
              run: pnpm exec supabase functions deploy
