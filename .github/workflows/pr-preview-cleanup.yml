name: PR preview cleanup (Cloudflare Pages)

# Removes PR previews from the remappr-preview Pages project, which otherwise
# keeps every deployment of every PR (and its pr-N.remappr-preview.pages.dev
# alias) forever:
#   - when a PR closes (merged or not), its pr-<number> deployments;
#   - on a manual run, the deployments of every pr-<number> whose PR is no
#     longer open — a one-off sweep of the backlog.
# Deletion is permanent; open PRs are never touched.
on:
    pull_request:
        branches: [main, dev]
        types: [closed]
    workflow_dispatch:

permissions:
    contents: read
    pull-requests: read

concurrency:
    group: pr-preview-cleanup
    cancel-in-progress: false

jobs:
    cleanup:
        runs-on: ubuntu-latest
        env:
            CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
            PROJECT: remappr-preview
            PR_NUMBER: ${{ github.event.pull_request.number }}
            GH_TOKEN: ${{ github.token }}
        steps:
            - name: Delete preview deployments
              run: |
                  set -euo pipefail
                  if [ -z "$CF_API_TOKEN" ]; then
                    echo "::warning::No Cloudflare token (Dependabot/fork PR) — nothing cleaned."
                    exit 0
                  fi
                  api="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$PROJECT/deployments"
                  auth=(-H "Authorization: Bearer $CF_API_TOKEN")

                  # Which PR branches to clear: this PR, or every closed one.
                  if [ -n "$PR_NUMBER" ]; then
                    keep() { [ "$1" != "pr-$PR_NUMBER" ]; }
                  else
                    OPEN=" $(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 500 --json number -q '.[].number' | tr '\n' ' ') "
                    keep() { [[ ! "$1" =~ ^pr-([0-9]+)$ ]] || [[ "$OPEN" == *" ${BASH_REMATCH[1]} "* ]]; }
                  fi

                  # Collect first, delete after, so deleting doesn't shift the
                  # pages being listed.
                  targets=()
                  page=1
                  while :; do
                    res=$(curl -sS -f "${auth[@]}" "$api?page=$page&per_page=25")
                    count=$(jq '.result | length' <<< "$res")
                    [ "$count" -eq 0 ] && break
                    while IFS=$'\t' read -r id branch; do
                      keep "$branch" || targets+=("$id $branch")
                    done < <(jq -r '.result[] | [.id, (.deployment_trigger.metadata.branch // "")] | @tsv' <<< "$res")
                    page=$((page + 1))
                  done

                  echo "${#targets[@]} deployment(s) to delete"
                  for t in "${targets[@]}"; do
                    read -r id branch <<< "$t"
                    # force: also removes a branch's aliased (latest) deployment.
                    if curl -sS -f -X DELETE "${auth[@]}" "$api/$id?force=true" > /dev/null; then
                      echo "deleted $branch $id"
                    else
                      echo "::warning::could not delete $branch $id"
                    fi
                  done
